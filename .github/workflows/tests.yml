name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      # The test suite covers the analyzer, repair engine, data pipeline, schema parsing,
      # services and API; none of it needs PyTorch, so CI installs the light dependencies only.
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
