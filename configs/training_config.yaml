# training_config.yaml
# Defaults for `python -m training.train` (every value can be overridden on the command line).

training:
  backbone: "huggingface/CodeBERTa-small-v1"   # CPU-friendly; use microsoft/codebert-base on a GPU
  data_dir: "data/processed"
  output_dir: "models/checkpoints/codeberta-small"
  epochs: 3
  batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.06
  max_grad_norm: 1.0
  max_length: 256
  loss: "cross_entropy"                         # or "focal"
  label_smoothing: 0.0
  eval_steps: 263                               # ~every 0.6 epoch; each validation pass costs ~4 min on CPU
  early_stopping_patience: 4                    # evaluations without validation macro-F1 improvement
  seed: 42
  cpu_threads: 2                                # physical cores on the reference laptop; 0 = PyTorch default
