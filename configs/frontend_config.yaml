# frontend_config.yaml
# Streamlit interface configuration

streamlit:
  title: "SQL Error Classifier Panel"
  api_url: "http://localhost:8000/api/v1/classify"
  theme: "dark"
  max_query_length: 1000
  show_confidence_threshold: 0.15
  analytics:
    enable_history_tracking: true
    history_limit: 10
