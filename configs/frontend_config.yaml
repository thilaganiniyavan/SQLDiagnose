# frontend_config.yaml
# Streamlit UI configuration. SQLDIAGNOSE_API_URL overrides api_url.

streamlit:
  title: "SQLDiagnose"
  api_url: "http://127.0.0.1:8000/api/v1"
  default_database: "concert_singer"
  request_timeout_s: 60
  nl2sql_timeout_s: 180      # the first NL2SQL request downloads/loads the generator
  history_limit: 15
